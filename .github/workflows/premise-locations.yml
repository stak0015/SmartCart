name: Refresh premise locations

# Google's terms allow cached coordinates for 30 days. This job deletes expired
# coordinates, then refreshes those older than 29 days from Google Places.

on:
  workflow_dispatch:
  schedule:
    # 3:00 AM Malaysia time = 19:00 UTC (after the daily PriceCatcher ingestion).
    - cron: "0 19 * * *"

permissions:
  contents: read

concurrency:
  group: premise-locations
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: frontend
    env:
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      DATABASE_SSL: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Delete coordinates older than 30 days
        run: node scripts/sync-premise-locations.mjs --cleanup-only

      - name: Refresh coordinates older than 29 days
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: node scripts/sync-premise-locations.mjs --all --requests-per-minute=300
