name: Refresh PriceCatcher data

on:
  workflow_dispatch:
  schedule:
    # 2:00 AM Malaysia time = 18:00 UTC
    - cron: "0 18 * * *"

permissions:
  contents: read

concurrency:
  group: pricecatcher-ingest
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: database/requirements.txt

      - name: Install ingestion dependencies
        run: python -m pip install -r database/requirements.txt

      - name: Ingest current PriceCatcher month
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: python database/ingest_pricecatcher.py --month

      - name: Apply reviewed English item names
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: python database/seed_item_names.py

      - name: Verify database
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: python database/verify_database.py --allow-missing-english-names
