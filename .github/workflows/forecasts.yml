name: Refresh weekly price forecasts

on:
  workflow_dispatch:
  schedule:
    # Monday 04:00 Malaysia time (Sunday 20:00 UTC).
    - cron: "0 20 * * 0"

permissions:
  contents: read

concurrency:
  group: price-forecast-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: forecast_tests
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: forecasting/requirements.txt
      - name: Install offline forecasting dependencies
        run: |
          python -m pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r forecasting/requirements.txt
      - name: Test refresh logic
        env:
          FORECAST_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/forecast_tests
        run: python -m pytest forecasting/tests -q
      - name: Prepare forecast tables
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: python -m forecasting.store migrate
      - name: Export active reference snapshot
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: >-
          python -m forecasting.store export --file .tmp/forecast-refresh/reference.json
          --bootstrap-from backend/data/price_forecasts.json
      - name: Generate and validate forecasts using updated official data
        run: >-
          python -m forecasting.refresh --source .tmp/forecast-refresh/reference.json
          --output .tmp/forecast-refresh/candidate.json
      - name: Publish validated batch atomically
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          python -m forecasting.store publish --file .tmp/forecast-refresh/candidate.json \
            --expected-active "$(cat .tmp/forecast-refresh/reference.active-id)"
      - name: Verify the active published version
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: python -m forecasting.store export --file .tmp/forecast-refresh/published.json
      - name: Save generation and validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: price-forecast-refresh-${{ github.run_id }}
          path: |
            .tmp/forecast-refresh/candidate.json
            .tmp/forecast-refresh/candidate.report.json
          if-no-files-found: warn
          retention-days: 30
