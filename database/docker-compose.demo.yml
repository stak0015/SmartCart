services:
  postgres-demo:
    image: postgres:16-alpine
    container_name: smartcart-postgres-demo
    restart: unless-stopped
    environment:
      POSTGRES_DB: smartcart_demo
      POSTGRES_USER: smartcart
      POSTGRES_PASSWORD: smartcart_dev_password
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - smartcart_postgres_demo_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartcart -d smartcart_demo"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  smartcart_postgres_demo_data:
